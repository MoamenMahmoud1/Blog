name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: blog
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: mysite.test_settings
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-longer-than-fifty-characters-do-not-use
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://localhost
      DB_NAME: blog
      DB_USER: blog
      DB_PASSWORD: ci-database-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CACHE_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: redis://127.0.0.1:6380/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Check template formatting
        run: djlint src/blog/templates --profile=django --check

      - name: Lint templates
        run: djlint src/blog/templates --profile=django --lint

      - name: Django system check
        run: python src/manage.py check

      - name: Check migrations
        run: python src/manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python src/manage.py test blog mysite --settings=mysite.test_settings

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build production image
        run: >
          docker build
          --file docker/django/Dockerfile
          --tag django-blog:ci
          .
