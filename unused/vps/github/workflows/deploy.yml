name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Determine commit
        id: commit
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${MANUAL_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${WORKFLOW_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Generate image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          repository="${REPOSITORY,,}"
          echo "sha=ghcr.io/${repository}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repository}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build production image
        env:
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          IMAGE_LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker build \
            --file docker/django/Dockerfile \
            --tag "$IMAGE_SHA" \
            --tag "$IMAGE_LATEST" \
            .

      - name: Push production image
        env:
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          IMAGE_LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy tested image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$IMAGE_SHA" "$COMMIT_SHA" <<'REMOTE'
          set -Eeuo pipefail

          deploy_path="$1"
          image="$2"
          commit_sha="$3"

          cd "$deploy_path"

          git fetch origin "$commit_sha"
          git checkout --detach "$commit_sha"

          APP_IMAGE="$image" docker compose pull
          APP_IMAGE="$image" docker compose up \
            --detach \
            --remove-orphans \
            --wait \
            --wait-timeout 180
          REMOTE

      - name: Verify HTTPS health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            "$HEALTHCHECK_URL"