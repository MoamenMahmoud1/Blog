<form method="post">
    {% csrf_token %}

    <div>
        {{ form.username.label }}
        {{ form.username }}
        
    </div>

    <div>
        {{ form.password.label }}
        {{ form.password }}
        
    </div>

    {% if form.non_field_errors %}
        {{ form.non_field_errors }}
    {% endif %}

    <button type="submit">Login</button>
</form>
