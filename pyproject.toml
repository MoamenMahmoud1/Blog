[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "src/blog/migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "S", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"docker/django/gunicorn.conf.py" = ["S108"]
"src/blog/tests/*.py" = ["S101", "S105", "S106"]
"src/mysite/settings.py" = ["S105"]
"src/mysite/test_settings.py" = ["F403", "F405"]

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120
use_gitignore = true
preserve_blank_lines = true

[tool.djlint.per-file-ignores]
"src/blog/templates/accounts/profile.html" = "T038"
