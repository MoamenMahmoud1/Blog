{% extends "blog/base.html" %}
{% load static %}

{% block title %}
    {{ presentation.title }}
{% endblock %}

{% block extra_css %}
    <link
        rel="stylesheet"
        href="{% static 'presentation/css/presentation.css' %}"
    >
{% endblock %}

{% block full_content %}
    <main
        id="presentationStage"
        class="presentation-stage"
        data-presentation="{{ presentation_data|escape }}"
    >
        <section class="presentation-viewport">

            <div
                id="cardStack"
                class="presentation-stack"
            >
                <article
                    id="activeCard"
                    class="presentation-card"
                >
                    <div
                        id="cardMedia"
                        class="presentation-card__media"
                    ></div>

                    <div class="presentation-card__body">

                        <span
                            id="cardLabel"
                            class="presentation-card__label"
                        ></span>

                        <h1 id="cardTitle"></h1>

                        <p id="cardContent"></p>

                    </div>
                </article>
            </div>

            <div
                id="cardProgress"
                class="presentation-progress"
                aria-live="polite"
            ></div>

            <button
                id="previousCard"
                class="
                    presentation-hit-area
                    presentation-hit-area--left
                "
                type="button"
                aria-label="Previous card"
            ></button>

            <button
                id="nextCard"
                class="
                    presentation-hit-area
                    presentation-hit-area--right
                "
                type="button"
                aria-label="Next card"
            ></button>

        </section>
    </main>
{% endblock %}

{% block extra_js %}
    <script
        src="{% static 'presentation/js/presentation.js' %}"
        defer
    ></script>
{% endblock %}
