{% extends "blog/base.html" %}
{% block title %}Delete post{% endblock %}
{% block content %}
    <h1>Delete post</h1>
    <div class="alert alert-danger">Are you sure you want to permanently delete “{{ post.title }}”?</div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete permanently</button>
        <a href="{% url 'blog:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
{% endblock %}
