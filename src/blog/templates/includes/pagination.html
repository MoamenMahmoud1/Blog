<div class="pagination">
    <span class="step-links">
        {% if page.has_previous %}
            <a href="?{% if query %}query={{ query|urlencode }}&amp;{% elif status_filter and status_filter != 'all' %}status={{ status_filter|urlencode }}&amp;{% endif %}page={{ page.previous_page_number }}">Previous</a>
        {% endif %}
        <span class="current">Page {{ page.number }} of {{ page.paginator.num_pages }}.</span>
        {% if page.has_next %}
            <a href="?{% if query %}query={{ query|urlencode }}&amp;{% elif status_filter and status_filter != 'all' %}status={{ status_filter|urlencode }}&amp;{% endif %}page={{ page.next_page_number }}">Next</a>
        {% endif %}
    </span>
</div>
