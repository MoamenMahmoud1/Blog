services:
  - type: keyvalue
    name: django-blog-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: django-blog-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/django/Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'python manage.py migrate --noinput &&
      exec gunicorn --config gunicorn.conf.py mysite.wsgi:application'
    healthCheckPath: /health/ready/
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mysite.settings_production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: django-blog-cache
          property: connectionString
      - key: STATIC_ROOT
        value: /app/staticfiles
      - key: MEDIA_ROOT
        value: /app/media
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: SECURE_HSTS_PRELOAD
        value: "False"
